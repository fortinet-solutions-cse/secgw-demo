[defaults]
# Standard Paths
inventory      = ./inventory.ini
roles_path     = ./roles

hash_behaviour = merge

# 1. Disable Host Key Checking (Essential for Labs)
# Prevents students from getting stuck on "The authenticity of host... can't be established"
host_key_checking = False

# 2. Variable Logic
# Since we are writing to host_vars, we can keep this False to encourage 
# better variable hygiene, or set to True to make role-writing easier.
inject_facts_as_vars = False

# 3. Clean Terminal Output
# Helps students focus on the task results rather than Ansible's internal noise
display_skipped_hosts = False
#callbacks_enabled = profile_tasks

# 4. Persistence (Cleaned Up)
# We remove all jsonfile caching settings because Play 2.0 now 
# handles persistence via host_vars YAML files.

[ssh_connection]
# Optimize connections for students so they don't have to wait 20s for every task
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no
pipelining = True


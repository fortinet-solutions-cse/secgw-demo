[defaults]
# Standard Paths
inventory      = ./inventory.ini
roles_path     = ./roles

# Use 'replace' (Ansible default) to ensure predictable variable behavior.
# Avoids 'mystery merges' that are hard for students to debug.
hash_behaviour = replace

# 1. Disable Host Key Checking (Essential for Labs)
# Prevents students from getting stuck on SSH authenticity prompts.
host_key_checking = False

# 2. Variable Logic
# Keeps facts in the 'ansible_facts' dictionary to prevent namespace collisions.
inject_facts_as_vars = False

# 3. Clean Terminal Output
# Helps students focus on task results by hiding skipped hosts.
display_skipped_hosts = False

[ssh_connection]
# Performance: reuse SSH connections to speed up the lab for students.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no
pipelining = True

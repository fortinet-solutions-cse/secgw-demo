- name: Run setup and background ping on clients
  hosts: gnbs
  gather_facts: no
  #become: yes # Use 'become: yes' if these commands require root/sudo access
  vars:
    #ansible_password: "{{ gnbs_password }}"
    ansible_password: "fortinet4A!!"
  tags:
    - connect_clients
    - never
  
  tasks:
    - name: Execute genrsa script
      ansible.builtin.command:
        cmd: ./genrsa
        chdir: /fabric

    - name: Execute CMP IR script
      ansible.builtin.command:
        cmd: ./ir
        chdir: /fabric

    - name: Execute config_ss.sh script
      ansible.builtin.command:
        cmd: ./config_ss.sh
        chdir: /fabric

    - name: Start continuous ping to 10.30.1.1 in the background
      ansible.builtin.shell: |
        /bin/bash -c "ping 10.30.1.1 > /tmp/ping_output.log 2>&1 & disown"
      # Note: We use shell here to manage the background process cleanly.
      # The /bin/bash -c ... & disown ensures the process continues after Ansible exits.
      # The output is redirected to a file so it doesn't block stdout.
      args:
        chdir: /fabric 

      # The async/poll settings are not strictly required because of 'disown',
      # but they are good practice if you were managing a long-running process
      # *without* disown, or if you needed to check the job status later.
      # In this case, disown is the key.
      # async: 1 # Run for 1 second before checking status (or returning)
      # poll: 0  # Do not wait for the job to finish, and return immediately
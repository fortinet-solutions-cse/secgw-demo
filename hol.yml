---
#  INIT — Run script, write host_vars and group_vars/all/runtime.yml
- name: Initialize credentials from script and write to persistent files
  hosts: localhost
  gather_facts: false
  tags: [init]
  vars_files:
    - "{{ playbook_dir }}/group_vars/all.yml"
  tasks:
    - name: Run init script to fetch credentials
      ansible.builtin.command: "./scripts/init.py"
      args:
        stdin: >-
          {{ {
            'fmg_host': hostvars[groups['fortimanagers'][0]]['ansible_host'],
            'faz_host': hostvars[groups['fortianalyzers'][0]]['ansible_host'],
            'seg1_ip': secgws.seg1.mgmtip,
            'seg2_ip': secgws.seg2.mgmtip,
            'ssh_port': ssh_port,
            'username': username
          } | to_json }}
      changed_when: false
      register: init_output

    - name: Parse init script output
      ansible.builtin.set_fact:
        creds: "{{ init_output.stdout | from_json }}"

    - name: Ensure group_vars/all directory exists
      ansible.builtin.file:
        path: "{{ playbook_dir }}/group_vars/all"
        state: directory

    - name: Write host_vars for fortimanagers
      ansible.builtin.copy:
        dest: "{{ playbook_dir }}/host_vars/{{ item }}.yml"
        content: |
          ---
          ansible_httpapi_access_token: "{{ creds.FMG_ACCESS_TOKEN }}"
          ansible_password: "{{ creds.DEVICE_PASSWORD }}"
          fmg_sn: "{{ creds.FMG_SN }}"
      loop: "{{ groups['fortimanagers'] }}"

    - name: Write host_vars for fortianalyzers
      ansible.builtin.copy:
        dest: "{{ playbook_dir }}/host_vars/{{ item }}.yml"
        content: |
          ---
          ansible_httpapi_access_token: "{{ creds.FAZ_ACCESS_TOKEN }}"
          ansible_password: "{{ creds.DEVICE_PASSWORD }}"
          faz_sn: "{{ creds.FAZ_SN }}"
      loop: "{{ groups['fortianalyzers'] }}"

    - name: Load base vars from all.yml to perform merge
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/group_vars/all.yml"
        name: base_all_vars

    - name: "Write merged runtime vars to group_vars/all/runtime.yml"
      ansible.builtin.copy:
        dest: "{{ playbook_dir }}/group_vars/all/runtime.yml"
        content: |
          ---
          # Full Runtime Snapshot: Includes base variables + injected Serial Numbers
          # Regenerate by running: ansible-playbook hol.yml --tags init
          
          {{ (base_all_vars | combine({
            'secgws': base_all_vars.secgws | combine({
              'seg1': base_all_vars.secgws.seg1 | combine({'sn': creds.SEG1_SN}),
              'seg2': base_all_vars.secgws.seg2 | combine({'sn': creds.SEG2_SN})
            })
          })) | to_nice_yaml }}

- name: FMG Initialization
  hosts: fortimanagers
  gather_facts: false
  connection: httpapi
  tags: [init]
  roles:
    - role: 1_fmg_initialize

- name: FAZ Initialization
  hosts: fortianalyzers
  gather_facts: false
  connection: httpapi
  tags: [init]
  roles:
    - role: 2_faz_initialize

- name: FMG Add Devices
  hosts: fortimanagers
  gather_facts: false
  connection: httpapi
  tags: [add_devices_fmg, add_devices]
  roles:
    - role: 3_fmg_add_secgw_devices

- name: Device Provisioning
  hosts: fortimanagers
  gather_facts: false
  connection: httpapi
  tags: [system, add_devices]
  roles:
    - role: 4_system

- name: FAZ Add Devices
  hosts: fortianalyzers
  gather_facts: false
  connection: httpapi
  tags: [add_devices_faz, add_devices]
  roles:
    - role: 5_faz_add_secgw_devices

- name: FGSP
  hosts: fortimanagers
  gather_facts: false
  connection: httpapi
  tags: [fgsp]
  roles:
    - role: 6_fgsp

- name: Router
  hosts: fortimanagers
  gather_facts: false
  connection: httpapi
  tags: [router]
  roles:
    - role: 7_router

- name: Certificates
  hosts: fortimanagers
  gather_facts: false
  connection: httpapi
  tags: [certificates]
  roles:
    - role: 8_certificates

- name: VPN
  hosts: fortimanagers
  gather_facts: false
  connection: httpapi
  tags: [vpn]
  roles:
    - role: 9_vpn

- name: Policy Packages
  hosts: fortimanagers
  gather_facts: false
  connection: httpapi
  tags: [policy_packages]
  roles:
    - role: 10_policy_packages

- name: Connect gNodeB clients
  hosts: gnbs
  gather_facts: false
  vars:
    ansible_password: "{{ hostvars[groups['fortianalyzers'][0]]['ansible_password'] }}"
  tags: [never, connect_gnbs]
  roles:
    - role: 11_connect_gnbs

- name: CRL Configuration
  hosts: fortimanagers
  gather_facts: false
  connection: httpapi
  tags: [never, crl]
  roles:
    - role: 12_crl
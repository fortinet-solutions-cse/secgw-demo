---
- name: Objects Address
  fortinet.fortimanager.fmgr_generic:
    access_token: "{{ access_token }}"
    method: set
    params:
      - url: "pm/config/adom/{{ adom_secgw }}/obj/firewall/address"
        data:
          - name: "N2N3-core"
            subnet:
              - "10.30.0.0"
              - "255.255.252.0"
          - name: "N2N3-ran"
            subnet:
              - "10.30.255.0"
              - "255.255.255.0"
          - name: "UPF"
            subnet:
              - "10.30.30.0"
              - "255.255.255.0"
          - name: "AMF"
            subnet:
              - "10.30.20.0"
              - "255.255.255.0"

- name: Objects Groups
  fortinet.fortimanager.fmgr_generic:
    access_token: "{{ access_token }}"
    method: set
    params:
      - url: "pm/config/adom/{{ adom_secgw }}/obj/firewall/addrgrp"
        data:
          - member:
              - "N2N3-core"
              - "N2N3-ran"
              - "UPF"
              - "AMF"
            name: "5G-Networks"

- name: 'IPv6 Objects Address'
  fortinet.fortimanager.fmgr_generic:
    access_token: "{{ access_token }}"
    method: set
    params:
      - url: "pm/config/adom/{{ adom_secgw }}/obj/firewall/address6"
        data:
          - ip6: "fd00::30:0:0/96"
            name: "N2N3-core-ipv6"
          - ip6: "fd00::30:cafe:0/112"
            name: "N2N3-ran-ipv6"
  when: enable_ipv6 is true

- name: 'IPv6 Objects Groups'
  fortinet.fortimanager.fmgr_generic:
    access_token: "{{ access_token }}"
    method: set
    params:
      - url: "pm/config/adom/{{ adom_secgw }}/obj/firewall/addrgrp6"
        data:
          - member:
              - "N2N3-ran-ipv6"
              - "N2N3-core-ipv6"
            name: "5G-Networks-ipv6"
  when: enable_ipv6 is true
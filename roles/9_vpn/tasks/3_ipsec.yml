---
- name: IPsec phase1
  fortinet.fortimanager.fmgr_generic:
    access_token: "{{ ansible_httpapi_access_token }}"
    method: set
    params:
      - url: "pm/config/device/{{ item.name }}/vdom/{{ secgws.region1_traffic_vdom }}/vpn/ipsec/phase1-interface"
        data:
          -
            name: 'SecGW'
            type: 'dynamic'
            authmethod: 'signature'
            certificate: '{{ item.certname }}'
            ike-version: 2
            interface: "{{ secgws.interface_names.lo_secgw }}"
            ip-version: '4'
            default-gw: "{{ (item.interfaces | selectattr('name', 'equalto', secgws.interface_names.lo_secgw) | first).ip[0] }}"
            mode-cfg: 'disable'
            peertype: 'peer'
            peer: 'mno_ca'
            dhgrp: '31'
            proposal: 'aes128gcm-prfsha256'
            fgsp-sync: 'enable'
            dpd: 'on-idle'
            dpd-retryinterval: '20'
  loop:
    - "{{ secgws.seg1 }}"
    - "{{ secgws.seg2 }}"
  loop_control:
    label: "{{ item.name }}"

- name: IPsec phase2
  fortinet.fortimanager.fmgr_generic:
    access_token: "{{ ansible_httpapi_access_token }}"
    method: set
    params:
      - url: "pm/config/device/{{ item.name }}/vdom/{{ secgws.region1_traffic_vdom }}/vpn/ipsec/phase2-interface"
        data:
          -
            name: "SecGW"
            phase1name: "SecGW"
            proposal: "aes128gcm"
            dhgrp: "31"
  loop:
    - "{{ secgws.seg1 }}"
    - "{{ secgws.seg2 }}"
  loop_control:
    label: "{{ item.name }}"

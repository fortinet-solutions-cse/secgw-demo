---
- name: 'Prefix List trust-core-addresses'
  fortinet.fortimanager.fmgr_generic:
    access_token: "{{ ansible_httpapi_access_token }}"
    method: set
    params:
      - url: "pm/config/device/{{ item.name }}/vdom/{{ secgws.region1_traffic_vdom }}/router/prefix-list"
        data:
          - name: 'pl-trust-core-addresses'
            rule:
              - id: 1
                le: 32
                prefix: "{{ ip.trust_core_subnet }}"
  loop:
    - "{{ secgws.seg1 }}"
    - "{{ secgws.seg2 }}"
  loop_control:
    label: "{{ item.name }}"


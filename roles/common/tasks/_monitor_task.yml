# Internal task: Do not call directly.
# This task extracts a task ID from a registered variable, checks for initial
# failure, and then polls the task until it is complete.
# Required variables:
# - fmgr_raw_task_result: The entire variable registered from a FortiManager task.
---
- name: Extract FortiManager task ID and check initial response
  ansible.builtin.set_fact:
    common_fmgr_task_id: "{{ fmgr_raw_task_result.meta.response_data.task | default('') | string }}"
    common_fmgr_initial_ok: "{{ fmgr_raw_task_result.rc | default(1) | int == 0 }}"

- name: Fail if FortiManager did not return a task ID
  ansible.builtin.fail:
    msg: "Could not determine FortiManager task ID. Response: {{ fmgr_raw_task_result }}"
  when: common_fmgr_task_id == '' and not common_fmgr_initial_ok

- name: "Poll FortiManager task status for task {{ common_fmgr_task_id }}"
  fortinet.fortimanager.fmgr_fact:
    access_token: "{{ ansible_facts.access_token }}"
    facts:
      selector: "task_task"
      params:
        task: "{{ common_fmgr_task_id }}"
  register: common_taskinfo
  retries: 60
  delay: 2
  until: common_fmgr_is_finished
  failed_when: not common_fmgr_is_success
  when: "common_fmgr_task_id != ''"
  vars:
    # This logic robustly handles cases where the API returns a dict, a list of dicts, or an empty list.
    _task_details: "{{ ([common_taskinfo.meta.response_data | default([])] | flatten) | first | default({}) }}"
    _task_state: "{{ _task_details.state | default('running') | lower }}"

    # Define clear success and failure conditions based on the task's final state.
    _final_states:
      - done
      - error
      - exception
      - failed
      - success
      - finished
    common_fmgr_is_finished: "{{ _task_state in _final_states }}"
    common_fmgr_is_success: "{{ _task_state in ['done', 'success', 'finished'] }}"

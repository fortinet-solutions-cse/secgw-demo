- name: 'Create firewall policies'
  fortinet.fortimanager.fmgr_generic:
    access_token: "{{ ansible_httpapi_access_token }}"
    method: set
    params:
      - url: "/pm/config/adom/{{ adom_secgw }}/pkg/{{ secgws.policy_package }}/firewall/policy"
        data:
          - name: 'Allow BFD Multihop from Untrust'
            policyid: 1
            action: 'accept'
            srcaddr: 'all'
            srcintf: 'SZ_UNTRUST'
            dstaddr: 'all'
            dstintf: "{{ secgws.interface_names.lo_untrust }}"
            logtraffic: 'disable'
            schedule: 'always'
            service:
              - 'BFD-multihop'
          - name: 'Allow BFD Multihop from Trust'
            policyid: 2
            action: 'accept'
            srcaddr: 'all'
            srcintf: 'SZ_TRUST'
            dstaddr: 'all'
            dstintf: "{{ secgws.interface_names.lo_trust }}"
            logtraffic: 'disable'
            schedule: 'always'
            service:
              - 'BFD-multihop'
          - name: 'Allow BFD Multihop from PKI'
            policyid: 3
            action: 'accept'
            srcaddr: 'all'
            srcintf: 'SZ_PKI'
            dstaddr: 'all'
            dstintf: "{{ secgws.interface_names.lo_pki }}"
            logtraffic: 'disable'
            schedule: 'always'
            service:
              - 'BFD-multihop'
          - name: 'Allow RAN VPN'
            policyid: 10
            action: 'accept'
            srcaddr: 'all'
            srcintf: 'SZ_UNTRUST'
            dstaddr: 'all'
            dstintf: "{{ secgws.interface_names.lo_secgw }}"
            logtraffic: 'disable'
            schedule: 'always'
            service:
              - 'IKE'
              - 'ESP'
              - 'ALL_ICMP'
          - name: 'Allow gNodeB inner to 5GC'
            policyid: 30
            action: 'accept'
            srcintf: 'SecGW'
            srcaddr: 'N2N3-ran'
            dstintf: 'SZ_TRUST'
            dstaddr: '5G-Networks'
            logtraffic: 'all'
            logtraffic-start: 'enable'
            schedule: 'always'
            service: 'LTE-5G-Services'
          - name: 'Allow 5GC to inner gNodeB'
            policyid: 40
            action: 'accept'
            srcintf: 'SZ_TRUST'
            srcaddr: '5G-Networks'
            dstintf: 'SecGW'
            dstaddr: 'N2N3-ran'
            logtraffic: 'all'
            logtraffic-start: 'enable'
            schedule: 'always'
            service: 'LTE-5G-Services'
          - name: 'Allow Xn gNodeB to gNodeB'
            policyid: 50
            action: 'accept'
            srcintf: 'SecGW'
            srcaddr: 'N2N3-ran'
            dstintf: 'SecGW'
            dstaddr: 'N2N3-ran'
            logtraffic: 'all'
            logtraffic-start: 'enable'
            schedule: 'always'
            service: 'LTE-5G-Services'
  changed_when: false
  
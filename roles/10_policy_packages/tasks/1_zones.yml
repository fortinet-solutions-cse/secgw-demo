- name: 'Create security zones'
  fortinet.fortimanager.fmgr_generic:
    access_token: "{{ access_token }}"
    method: set
    params:
      - url: "pm/config/device/{{ item.name }}/vdom/{{ secgws.region1_traffic_vdom }}/system/zone"
        data:
          - name: 'SZ_UNTRUST'
            description: 'Security Zone Untrust RAN'
            interface:
              - 'agg1.20'
              - 'agg2.20'
            intrazone: 'allow'
          - name: 'SZ_TRUST'
            description: 'Security Zone Trust. RAN and Core'
            interface:
              - 'agg1.30'
              - 'agg2.30'
            intrazone: 'allow'
  loop:
    - "{{ secgws.seg1 }}"
    - "{{ secgws.seg2 }}"
  loop_control:
    label: '{{ item.name }}'
  changed_when: false

- name: FGSP Session Pickup
  fortinet.fortimanager.fmgr_generic:
    access_token: "{{ ansible_httpapi_access_token }}"
    method: set
    params:
      - url: "pm/config/device/{{ item.name }}/global/sys/ha"
        data:
          sync-packet-balance: 'enable'
          session-pickup: 'enable'
          session-pickup-connectionless: 'enable'
  loop:
    - "{{ secgws.seg1 }}"
    - "{{ secgws.seg2 }}"
  loop_control:
    label: "{{ item.name }}"
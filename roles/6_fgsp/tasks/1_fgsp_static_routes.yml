- name: 'Static routes - vdom root'
  fortinet.fortimanager.fmgr_generic:
    access_token: "{{ ansible_httpapi_access_token }}"
    method: set
    params:
      - url: "pm/config/device/{{ item.name }}/vdom/root/router/static"
        data: "{{ item.static_routes.vdom_root }}"
  loop:
    - "{{ secgws.seg1 }}"
    - "{{ secgws.seg2 }}"
  loop_control:
    label: "{{ item.name }}"

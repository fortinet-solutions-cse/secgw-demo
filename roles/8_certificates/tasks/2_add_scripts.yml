---
- name: Add scripts to generate CMP IR RSA certificates
  fortinet.fortimanager.fmgr_generic:
    access_token: "{{ ansible_httpapi_access_token }}"
    method: set
    params:
      - url: "pm/config/adom/{{ adom_secgw }}/obj/fmg/script"
        data:
          name: "{{ item.name }}_cmp_ir"
          type: "cli"
          target: "remote_device"
          content: |
            config vdom
                edit {{ secgws.region1_traffic_vdom }}
                    execute vpn certificate local generate cmp-ec {{ item.certname }} secp384r1 {{ secgws.cmp_server_ip }}:80 /cert/cmp2/ mno_cmp_server Fortinet_Factory "" "" "C=CA,O=mno,OU=FGT,CN={{ runtime_vars[item.certname + '_sn'] }}" ""
                end
  loop:
    - "{{ secgws.seg1 }}"
    - "{{ secgws.seg2 }}"
  loop_control:
    label: "{{ item.name }}"

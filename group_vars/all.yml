        vlanid: "{{ secgws.vlans.ran_untrust }}"
      - name: "agg2.{{ secgws.vlans.ran_untrust }}"
        alias: 'RAN_UNTRUST2'
        description: "FGT-SEG2 agg2.{{ secgws.vlans.ran_untrust }} to pe22 bond1.{{ secgws.vlans.ran_untrust }} vrf: ran-untrust"

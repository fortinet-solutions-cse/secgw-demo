        allowaccess: 'ping'
        ip: 
            - '10.20.255.1'
            - '255.255.255.255'
        ipv6:
            ip6-allowaccess: 'ping'
            ip6-address: 'fd00::20:ff:1/128'
        vdom: "{{ secgws.region1_traffic_vdom }}"
      - name: 'agg1'
        alias: 'agg1_pe21'
        description: 'FGT-SEG2 agg1 to pe21 bond1'
        type: 'aggregate'
        vdom: 'root'
        lacp-speed: 'fast'
        algorithm: 'L3'
        min-links: '2'
        member:
            - 'port1'
            - 'port3'
      - name: 'agg2'
        alias: 'agg2_pe22'
        description: 'FGT-SEG2 agg2 to pe22 bond1'
        type: 'aggregate'
        vdom: 'root'
        lacp-speed: 'fast'
        algorithm: 'L3'
        min-links: '2'
        member:
            - 'port2'
            - 'port4'
      - name: "agg1.{{ secgws.vlans.fgspsync }}"
        alias: 'FGSP1'
        description: "FGT-SEG2 agg1.{{ secgws.vlans.fgspsync }} to pe21 bond1.{{ secgws.vlans.fgspsync }} vrf: fgspsync"
        interface: 'agg1'
        allowaccess: 'ping'
        ip: 
            - '10.10.2.1'
            - '255.255.255.254'
        vdom: 'root'
        vlanid: "{{ secgws.vlans.fgspsync }}"
      - name: "agg2.{{ secgws.vlans.fgspsync }}"
        alias: 'FGSP2'
        description: "FGT-SEG2 agg2.{{ secgws.vlans.fgspsync }} to pe22 bond1.{{ secgws.vlans.fgspsync }} vrf: fgspsync"

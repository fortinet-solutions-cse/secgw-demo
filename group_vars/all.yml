        ip: 
            - '10.10.2.3'
            - '255.255.255.254'
        vdom: 'root'
        vlanid: "{{ secgws.vlans.fgspsync }}"
      - name: "agg1.{{ secgws.vlans.ran_untrust }}"
        alias: 'RAN_UNTRUST1'
        description: "FGT-SEG2 agg1.{{ secgws.vlans.ran_untrust }} to pe21 bond1.{{ secgws.vlans.ran_untrust }} vrf: ran-untrust"

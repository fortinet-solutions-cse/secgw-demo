---

# NOTE: Certain credentials are set and overridden by the 'init' play.
# After running `ansible-playbook hol.yml --tags init`, the 'password'
# and device-specific serial numbers ('sn') will be populated from the
# Ansible fact cache for subsequent playbook runs.

# Global variables used in SEG HoL
enable_ipv6: false
ansible_httpapi_port: 443
ansible_httpapi_use_ssl: true
ansible_httpapi_validate_certs: false
ssh_port: 22
username: 'admin'
fmc_timezone: 28
#password: Populated by init play

# FMC vars (FMG and FAZ)
adom_status: 'enable'
adom_secgw: 'SecGW'
idle_timeout: 28800
idle_timeout_gui: 28800

ip:
  client_inner_subnet: '10.30.100.0/24'

routers:
  as: '65001'


# SecGW vars
secgws:
  # common secgw settings
  admintimeout: 480
  region1_traffic_vdom: 'SecGW-R1'
  region1_group: 'SecGW-R1'
  system_template_name: 'SecGW'
  policy_package: 'PP_SecGW'
  timezone: '28'
  cmp_server_ip: 10.30.2.6
  ipsec_loopback_interface_name: 'Lo1-SecGW'
  vlans:
    fgspsync: 10
    pki: 11
    ran_untrust: 20
    ran_trust: 30

  seg1:
    name: 'FGT-SEG-1'
    mgmtip: '10.254.1.101'
    certname: 'seg1'
    #sn: Populated by init play 
    static_routes:
      - device: 'agg1.10'
        dst: 
          - '10.10.2.1'
          - '255.255.255.255'
        gateway: '10.10.1.0'
        comment: 'fgsp peering via pe11'
      - device: 'agg2.10'
        dst: 
          - '10.10.2.3'
          - '255.255.255.255'
        gateway: '10.10.1.2'
        comment: 'fgsp peering via pe12'
    bgp:
        router_id: '10.0.1.3'
        as: '65100'
        ebgp_multipath: 'enable'
        holdtime_timer: 30
        keepalive_timer: 10  
    interfaces:
      - name: 'port1'
        allowaccess: ''
        mode: 'static'
      - name: 'fortilink'
        status: 'down'
      - name: 'Unused-Ports'
        status: 'down'
      - name: "{{ secgws.ipsec_loopback_interface_name }}"
        alias: 'IPSEC'
        description: 'IPsec Termination Endpoint'
        type: 'loopback'
        allowaccess: 'ping'
        ip: 
            - '10.20.255.1'
            - '255.255.255.255'
        ipv6:
            ip6-allowaccess: 'ping'
            ip6-address: 'fd00::20:ff:1/128'
        vdom: "{{ secgws.region1_traffic_vdom }}"
      - name: 'agg1'
        alias: 'agg1_pe11'
        description: 'FGT-SEG1 agg1 to pe11 bond1'
        type: 'aggregate'
        vdom: 'root'
        lacp-speed: 'fast'
        algorithm: 'L3'
        min-links: '2'
        member:
            - 'port1'
            - 'port3'
      - name: 'agg2'
        alias: 'agg2_pe12'
        description: 'FGT-SEG1 agg1 to pe12 bond1'
        type: 'aggregate'
        vdom: 'root'
        lacp-speed: 'fast'
        algorithm: 'L3'
        min-links: '2'
        member:
            - 'port2'
            - 'port4'
      - name: 'agg1.10'
        alias: 'FGSP1'
        description: 'FGT-SEG1 agg1.10 to pe11 vrf: fgspsync'
        interface: 'agg1'
        allowaccess: 'ping'
        ip: 
            - '10.10.1.1'
            - '255.255.255.254'
        vdom: 'root'
        vlanid: "{{ secgws.vlans.fgspsync }}"
      - name: 'agg2.10'
        alias: 'FGSP2'
        allowaccess: 'ping'
        description: 'FGT-SEG1 agg2.10 to pe12 vrf: fgspsync'
        interface: 'agg2'
        ip: 
            - '10.10.1.3'
            - '255.255.255.254'
        vdom: 'root'
        vlanid: "{{ secgws.vlans.fgspsync }}"
      - name: 'agg1.20'
        alias: 'RAN_UNTRUST1'
        allowaccess: 'ping'
        description: 'FGT-SEG1 agg1.20 to pe11 eth1.20 vrf: ran-untrust'
        interface: 'agg1'
        ip: 
            - '10.20.1.1'
            - '255.255.255.254'
        ipv6:
            ip6-allowaccess: 'ping'
            ip6-address: 'fd00::20:1:1/127'
        vdom: "{{ secgws.region1_traffic_vdom }}"
        vlanid: "{{ secgws.vlans.ran_untrust }}"
      - name: 'agg2.20'
        alias: 'RAN_UNTRUST2'
        description: 'FGT-SEG1 agg2.20 to pe12 eth1.20 vrf: ran-untrust'
        allowaccess: 'ping'
        interface: 'agg2'
        ip: 
            - '10.20.1.3'
            - '255.255.255.254'
        ipv6:
            ip6-allowaccess: 'ping'
            ip6-address: 'fd00::20:1:3/127'
        vdom: "{{ secgws.region1_traffic_vdom }}"
        vlanid: "{{ secgws.vlans.ran_untrust }}"
      - name: 'agg1.30'
        alias: 'RAN_TRUST1'
        description: 'FGT-SEG1 agg1.30 to pe11 eth1.30 vrf: ran-trust'
        interface: 'agg1'
        allowaccess: 'ping'
        ip: 
            - '10.30.1.1'
            - '255.255.255.254'
        ipv6:
            ip6-allowaccess: 'ping'
            ip6-address: 'fd00::30:1:1/127'
        vdom: "{{ secgws.region1_traffic_vdom }}"
        vlanid: "{{ secgws.vlans.ran_trust }}"
      - name: 'agg2.30'
        alias: 'RAN_TRUST2'
        description: 'FGT-SEG1 agg2.30 to pe12 eth1.30 vrf: ran-trust'
        interface: 'agg2'
        allowaccess: 'ping'
        ip: 
            - '10.30.1.3'
            - '255.255.255.254'
        ipv6:
            ip6-allowaccess: 'ping'
            ip6-address: 'fd00::30:1:3/127'
        vdom: "{{ secgws.region1_traffic_vdom }}"
        vlanid: "{{ secgws.vlans.ran_trust }}"
      - name: "agg1.{{ secgws.vlans.pki }}"
        alias: 'PKI1'
        description: "FGT-SEG1 agg1.{{ secgws.vlans.pki }} to pe11 eth1.{{ secgws.vlans.pki }} vrf: pki"
        interface: 'agg1'
        allowaccess: 'ping'
        ip: 
            - '10.11.1.1'
            - '255.255.255.254'
        vdom: 'root'
        vlanid: "{{ secgws.vlans.pki }}"
      - name: "agg2.{{ secgws.vlans.pki }}"
        alias: 'PKI2'
        vdom: 'root'
        vlanid: "{{ secgws.vlans.pki }}"
        description: "FGT-SEG1 agg2.{{ secgws.vlans.pki }} to pe12 agg1.{{ secgws.vlans.pki }} vrf: pki"
        interface: 'agg2'
        allowaccess: 'ping'
        ip: 
            - '10.11.1.3'
            - '255.255.255.254'
  seg2:
    name: 'FGT-SEG-2'
    mgmtip: '10.254.1.102'
    certname: 'seg2'
    #sn: Populated by init play 
    static_routes:
      - device: 'agg1.10'
